    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!--
      SPA redirect decoder (pairs with 404.html) — https://github.com/rafgraph/spa-github-pages
      Restores the real path after GitHub Pages' 404.html redirect, so deep links
      like /portfolio work on direct visit and refresh. Must run before the app.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
